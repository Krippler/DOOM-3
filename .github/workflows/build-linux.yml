name: Linux build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Create a release with this tag (e.g. v1.0.0), leave empty to only build'
        required: false
        default: ''
      release_target:
        description: 'Commit or branch the new tag points at'
        required: false
        default: 'master'

permissions:
  contents: write

jobs:
  linux-x86_64:
    name: Linux x86_64 (portable)
    # glibc is backwards compatible, so a binary built here also runs on
    # rolling distributions with a newer glibc such as Arch and CachyOS
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libsdl2-dev libgl-dev libopenal-dev

      - name: Configure
        run: cmake -S neo -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Package
        run: |
          set -e
          PKG=doom3-linux-x86_64
          cmake --install build --prefix "dist/$PKG" --strip
          cp dist/README-linux.txt "dist/$PKG/README.txt"
          cp COPYING.txt "dist/$PKG/"
          mkdir -p "dist/$PKG/base" "dist/$PKG/d3xp"
          cp dist/base/PUT_PAK_FILES_HERE.txt "dist/$PKG/base/"
          cp dist/d3xp/PUT_PAK_FILES_HERE.txt "dist/$PKG/d3xp/"
          tar -C dist -czf "dist/$PKG.tar.gz" "$PKG"
          ls -l "dist/$PKG" "dist/$PKG/base" "dist/$PKG/d3xp"
          file "dist/$PKG/doom3" "dist/$PKG/base.so" "dist/$PKG/d3xp.so"

      - name: Smoke test
        run: |
          PKG=dist/doom3-linux-x86_64
          # every library must resolve and the game code must export its entry point
          if ldd "$PKG/doom3" "$PKG/base.so" "$PKG/d3xp.so" | grep "not found"; then exit 1; fi
          nm -D "$PKG/base.so" | grep -q " T GetGameAPI"
          nm -D "$PKG/d3xp.so" | grep -q " T GetGameAPI"
          # no game data here, the engine must start and fail cleanly on the missing paks
          out=$(cd "$PKG" && HOME="$RUNNER_TEMP" timeout 30 ./doom3 +quit < /dev/null 2>&1 || true)
          echo "$out"
          echo "$out" | grep -q "DOOM 1.3.1.1304 linux-x86_64"

      - uses: actions/upload-artifact@v4
        with:
          name: doom3-linux-x86_64
          path: dist/doom3-linux-x86_64.tar.gz

  arch:
    name: Arch Linux / CachyOS package
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install dependencies
        run: pacman -Syu --noconfirm --needed base-devel cmake ninja sdl2 mesa openal git sudo namcap

      - uses: actions/checkout@v4
        with:
          # the package version comes from the release tags
          fetch-depth: 0

      - name: Set the package version
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            VER="${GITHUB_REF_NAME#v}"
          elif [ -n "$RELEASE_TAG" ]; then
            VER="${RELEASE_TAG#v}"
          elif DESC=$(git describe --tags --long --match 'v*' 2>/dev/null); then
            # v1.0.0-3-gabc1234 -> 1.0.0.r3.gabc1234
            VER=$(echo "${DESC#v}" | sed 's/-\([0-9]*\)-\(g[0-9a-f]*\)$/.r\1.\2/')
          else
            VER=0.0.0
          fi
          VER=$(echo "$VER" | tr '-' '_')
          echo "package version $VER"
          sed -i "s/^pkgver=.*/pkgver=$VER/" dist/arch/PKGBUILD

      - name: Build the package
        run: |
          # makepkg refuses to run as root
          useradd -m builder
          chown -R builder "$GITHUB_WORKSPACE"
          cd dist/arch
          sudo -u builder makepkg --noconfirm
          ls -l *.pkg.tar.zst

      - name: Check the package
        run: |
          namcap dist/arch/*.pkg.tar.zst || true
          pacman -U --noconfirm dist/arch/*.pkg.tar.zst
          pacman -Qlq doom3-gpl
          # no game data here, the launcher must explain where it goes and the
          # engine must start and fail cleanly on the missing paks
          out=$(cd /tmp && sudo -u builder timeout 30 doom3 +quit < /dev/null 2>&1 || true)
          echo "$out"
          echo "$out" | grep -q "no DOOM 3 game data found"
          echo "$out" | grep -q "DOOM 1.3.1.1304 linux-x86_64"

      - uses: actions/upload-artifact@v4
        with:
          name: doom3-gpl-arch
          path: dist/arch/*.pkg.tar.zst

  release:
    name: Publish release
    needs: [linux-x86_64, arch]
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - run: ls -l artifacts

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: DOOM 3 ${{ github.ref_name }} for 64-bit Linux
          body_path: dist/RELEASE_NOTES.md
          files: |
            artifacts/doom3-linux-x86_64.tar.gz
            artifacts/*.pkg.tar.zst

      - name: Publish release (manual run)
        if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          target_commitish: ${{ inputs.release_target }}
          name: DOOM 3 ${{ inputs.release_tag }} for 64-bit Linux
          body_path: dist/RELEASE_NOTES.md
          files: |
            artifacts/doom3-linux-x86_64.tar.gz
            artifacts/*.pkg.tar.zst
